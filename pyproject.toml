[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vp-rspca"
version = "0.2.0"
description = "Sparse and robust PCA with variable projection for synthetic recovery, video decomposition, and genomics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mafeifei798" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
experiments = [
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pillow>=10",
  "scikit-learn>=1.3",
]
frozen-genomics = ["scikit-learn==1.7.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/mafeifei798/Sparse-Robust-PCA-VP"

[tool.setuptools]
packages = ["rspca"]
package-dir = { rspca = "src/rspca" }
py-modules = [
  "randomized_spca_vp",
  "robust_spca_vp",
  "spca_variable_projection",
  "spca_variable_projection_fista_bt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "historical_environment: strict bitwise replay requiring the original numerical environment",
]
